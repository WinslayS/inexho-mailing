<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#003b5c" />
    <title>INEXHO Mailing</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="icons.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="toolbar editor-only">
      <a class="app-brand" href="#" aria-label="INEXHO Mailing — back to top"
        ><span class="app-mark">i.</span
        ><span>INEXHO <strong>Mailing</strong></span></a
      >
      <div class="toolbar-actions">
        <button id="add" class="add-button" disabled>+ Add property</button>
        <span id="save-status" role="status" aria-live="polite">Loading…</span>
        <button id="reset" class="quiet" disabled>Reset</button>
        <button id="export" class="primary" disabled>
          Export PDF <span aria-hidden="true">↗</span>
        </button>
      </div>
    </header>
    <div class="workspace-intro editor-only">
      <div>
        <span class="overline">YOUR MAILING, READY TO EDIT</span>
        <p>
          Click to edit. Drag to reorder. The first three properties show
          photos.
        </p>
      </div>
      <span class="local-note">Saved in this browser only</span>
    </div>
    <main
      id="pages"
      aria-label="Editable mailing document"
      aria-busy="true"
    ></main>
    <p class="workspace-note editor-only">
      Example properties are for layout only. Confirm details before sending.
    </p>
    <div id="toast" class="editor-only" role="status" aria-live="polite"></div>
    <input
      id="photo-input"
      type="file"
      accept="image/jpeg,image/png,image/webp"
      multiple
      hidden
    />
    <dialog
      id="confirm-dialog"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-copy"
    >
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-copy"></p>
        <div class="dialog-actions">
          <button value="cancel" autofocus>Cancel</button
          ><button value="confirm" class="danger" id="confirm-action">
            Remove
          </button>
        </div>
      </form>
    </dialog>
    <noscript>This local mailing editor needs JavaScript enabled.</noscript>
  </body>
</html>
